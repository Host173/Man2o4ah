name: Claude review

# On demand only: comment "@claude review this" (or any request) on a PR.
# Runs on the team leader's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), not
# API billing. Read-only: Claude can read the code and comment, never push.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    # Only when the comment asks for @claude; the action also checks that the
    # commenter has write access to the repository.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --append-system-prompt "You review pull requests for Man2o4ah. Before reviewing, read docs/ai/skills/travel-platform/SKILL.md and the references it points to for the area the PR touches, plus .github/copilot-instructions.md, which lists the rules to check. Check the change against its ticket (the key is in the branch name and PR title) and its requirement in references/requirements.md. Report real problems only, each with a severity (Bug, Rule, Test, Docs, Nit), the rule or data-model section it breaks, and the fix. Say plainly when something is fine. If a rule isn't covered by the project files, say it is a question for the team leader instead of inventing one. Never push commits or change files."
