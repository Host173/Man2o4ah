name: PR checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming:
    name: Branch name and PR title
    # A develop -> main milestone release is exempt.
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title
        # Untrusted text goes through env, never into the script body.
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          branch_re='^(feature|fix|chore|docs|test|refactor)/[A-Z]{2,5}-[0-9]{2,3}[a-z]?-[a-z0-9][a-z0-9-]*$'
          title_re='(^|[^A-Za-z0-9])[A-Z]{2,5}-[0-9]{2,3}[a-z]?([^A-Za-z0-9]|$)'
          fail=0
          if ! [[ "$BRANCH" =~ $branch_re ]]; then
            echo "::error::Branch name '$BRANCH' is invalid. Expected <type>/<ID>-<description>, with type one of feature fix chore docs test refactor, e.g. feature/FLT-22-seat-hold or fix/ACC-07a-reset"
            fail=1
          fi
          if ! [[ "$TITLE" =~ $title_re ]]; then
            echo "::error::PR title '$TITLE' has no requirement ID. Include an ID like FLT-22, ACC-07a or PLT-01, e.g. 'FLT-22: seat hold'"
            fail=1
          fi
          exit "$fail"

  prompt-log:
    name: Prompt log entry
    # A develop -> main milestone release is exempt.
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the author's prompt log
        # Untrusted text goes through env, never into the script body.
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # GitHub login -> the member's log file (ai-prompts/<first name>.txt).
          case "$AUTHOR" in
            Host173) member=kareem ;;
            AishaAlRawahi) member=aisha ;;
            janaelmenshawy) member=jana ;;
            pierreofficial) member=pierre ;;
            Hestias-space) member=aya ;;
            Mohamed-Mokhtar-Elalfy-16009527) member=mokhtar ;;
            mostafa-elsahy) member=mostafa ;;
            *)
              echo "::notice::$AUTHOR is not a team member; prompt log not checked."
              exit 0 ;;
          esac
          log="ai-prompts/$member.txt"
          fail=0
          added=$(git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- "$log" | grep -c '^+Prompt:' || true)
          if [ "$added" -lt 1 ]; then
            echo "::error file=$log::No new prompt-log entry in $log. Every prompt gets one entry (format: AGENTS.example.md section 4)."
            fail=1
          else
            echo "$added new entry/entries in $log."
          fi
          # The logs are append-only: no PR may remove or change an existing line.
          removed=$(git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- ai-prompts | grep -c '^-[^-]' || true)
          if [ "$removed" -gt 0 ]; then
            echo "::error::$removed line(s) removed or changed in ai-prompts/. The logs are append-only."
            fail=1
          fi
          exit "$fail"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
