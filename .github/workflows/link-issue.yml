name: Link issue

# Links each PR to its ticket's issue: reads the ticket key from the branch
# name (or the PR title) and adds "Closes #<issue>" to the PR description.
# GitHub then shows the PR on the issue and closes the issue when the PR is
# merged into the default branch (develop).

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  link:
    name: Link the ticket's issue
    # A develop -> main milestone release has no ticket. Fork PRs can't write.
    if: github.head_ref != 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Add "Closes #<issue>" to the PR description
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const keyRe = /[A-Z]{2,5}-[0-9]{2,3}[a-z]?/;

            const fromBranch = pr.head.ref.match(new RegExp(`^[a-z]+/(${keyRe.source})-`));
            const fromTitle = pr.title.match(new RegExp(`(?:^|[^A-Za-z0-9])(${keyRe.source})(?:[^A-Za-z0-9]|$)`));
            const key = fromBranch?.[1] ?? fromTitle?.[1];
            if (!key) {
              core.info('No ticket key in the branch name or the PR title; nothing to link.');
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const issue = issues.find((i) => !i.pull_request && i.title.startsWith(`${key}:`));

            if (!issue) {
              const marker = '<!-- link-issue: no match -->';
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              if (!comments.some((c) => c.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `${marker}\nNo issue title starts with \`${key}:\`, so this PR isn't linked to an issue. Link it by hand (Development, on the right) if it belongs to one.`,
                });
              }
              core.info(`No issue found for ${key}.`);
              return;
            }

            const body = pr.body ?? '';
            const alreadyLinked = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${issue.number}\\b`, 'i',
            ).test(body);
            if (alreadyLinked) {
              core.info(`Already linked to #${issue.number}.`);
              return;
            }

            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number,
              body: `${body.trimEnd()}\n\nCloses #${issue.number}\n`.trimStart(),
            });
            core.info(`Linked ${key} → #${issue.number}.`);
